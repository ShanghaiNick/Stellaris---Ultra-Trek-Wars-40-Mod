 UTW_SW_POINT_DEFENCE_1_DESC:0 "Hull-mounted countermeasures against missiles and strike craft are often essential for larger and slower military vessels."
 UTW_SW_POINT_DEFENCE_2_DESC:0 "Updated prediction algorithms improves tracking and point-defense efficiency."
 UTW_SW_POINT_DEFENCE_3_DESC:0 "A wider range of available ammunition types vastly improves the effective interception rate of incoming threats."
 UTW_SW_RED_LASER:0 "Laser Cannon"
 UTW_SW_RED_LASER_DESC:0 "Laser weapons fire focused beams of light at targets, causing damage through the generation of intense heat."
 UTW_SW_STRIKE_CRAFT_HANGAR_1_DESC:0 "These manned strike craft are launched from a mothership and rely on their speed and small size to survive long enough to punch through enemy defenses."
