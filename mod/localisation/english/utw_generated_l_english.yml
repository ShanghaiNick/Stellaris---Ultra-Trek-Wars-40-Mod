 UTW_WH_MASS_ACCELERATOR_1_DESC:0 "An enormous variant of kinetic artillery, so large that it has to be placed in a fixed spinal mount."
 UTW_WH_MASS_ACCELERATOR_2_DESC:0 "An even more powerful variant of spinal-mounted kinetic artillery."
 UTW_WH_MASS_DRIVER_1:0 "Macro-Battery"
 UTW_WH_MASS_DRIVER_1_DESC:0 "These electromagnetic projectile launchers use magnets to accelerate armor-piercing rounds towards targets at high speeds."
