 UTW_WH_TORPEDO_2_DESC:0 "Upgraded space torpedoes encased in armor, to better withstand enemy point-defense fire. The armor fragments into shards that cause additional damage when the torpedo detonates."
 UTW_WH_TORPEDO_3_DESC:0 "Advanced torpedoes with very powerful warheads. They have a sleeker design, faster engines and upgraded shield modulators for slipping through energy screens."
 UTW_WH_UV_LASER:0 "Lance Turret"
 UTW_WH_UV_LASER_DESC:0 "Ultraviolet lasers are an updated and more powerful version of their blue predecessors. Accurate and destructive, these weapons are capable of inflicting great damage."
 UTW_WH_XRAY_LASER:0 "Heavy Lance Turret"
 UTW_WH_XRAY_LASER_DESC:0 "These lasers have a shorter wavelength than UV-based laser weaponry, but are even more destructive."
 origin_utw_star_trek:0 "Final Frontier"
 origin_utw_star_trek_desc:0 "This civilization broke the warp barrier and built its fleets around phasers, torpedoes and deflector technology. Its engineers think in a tradition no other power shares."
 origin_tooltip_utw_star_trek_effects:0 "- Researches the §YStar Trek§! weapon lines: phasers, disruptors, polaron beams and photon, quantum and plasma torpedoes\n- Starts with §YPhase Cannons§!, §YSpatial Torpedoes§! and §YRail Cannons§!\n- Base-game weapon lines above the starting tier do not appear as research options\n- Other weapons can still be learned by salvaging debris"
 origin_utw_star_wars:0 "A Galaxy Far, Far Away"
 origin_utw_star_wars_desc:0 "This civilization inherited millennia of hyperdrive-era shipbuilding: turbolaser batteries, ion cannons and swarms of starfighters. Its shipwrights follow a tradition no other power shares."
 origin_tooltip_utw_star_wars_effects:0 "- Researches the §YStar Wars§! weapon lines: turbolasers, ion cannons, blaster cannons, concussion missiles and proton torpedoes\n- Starts with §YLaser Cannons§!, §YConcussion Missiles§! and §YMass-Driver Cannons§!\n- Base-game weapon lines above the starting tier do not appear as research options\n- Other weapons can still be learned by salvaging debris"
 origin_utw_warhammer_40k:0 "In the Grim Darkness"
 origin_utw_warhammer_40k_desc:0 "This civilization builds cathedral-ships bristling with macrocannon batteries, lances and torpedoes, and has done so for ten thousand years. Its shipwrights follow a tradition no other power shares."
 origin_tooltip_utw_warhammer_40k_effects:0 "- Researches the §YWarhammer 40,000§! weapon lines: macrocannons, lances, plasma batteries, gauss arrays, nova cannons and torpedoes\n- Starts with §YLascannon Batteries§!, §YHunter-Killer Missiles§! and §YMacro-Batteries§!\n- Base-game weapon lines above the starting tier do not appear as research options\n- Other weapons can still be learned by salvaging debris"
 EMPIRE_DESIGN_utw_federation:0 "United Federation of Planets"
 EMPIRE_DESIGN_utw_federation_desc:0 "An alliance of worlds devoted to exploration, science and peaceful coexistence, defended by Starfleet."
