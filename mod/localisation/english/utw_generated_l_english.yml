 UTW_WH_GAMMA_LASER:0 "Pyros Melta-Lance"
 UTW_WH_GAMMA_LASER_DESC:0 "The electromagnetic radiation emitted by gamma lasers is of an extremely high frequency. Their destructive potential is unmatched in the field of laser weapons."
