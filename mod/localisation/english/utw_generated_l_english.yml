 utw_wh_tech_plasma_2_desc:0 "These new accelerators launch projectiles of high-energy plasma with improved containment fields. This results in less energy leakage as the projectile travels in space towards its target."
 utw_wh_tech_plasma_3:0 "Hellfire Plasma Macrocannons"
 utw_wh_tech_plasma_3_desc:0 "The latest in plasma weaponry, these cannons are fully militarized versions of the older, somewhat improvised plasma throwers. Their plasma projectiles are even deadlier."
 utw_wh_tech_disruptors_1:0 "Gauss Flayer Arrays"
 utw_wh_tech_disruptors_1_desc:0 "Disruptors fire high-energy bolts that weaken and destroy the molecular bonds that hold the target's constituent atoms together. They are capable of passing through shields and armor to wreak havoc directly on enemy hull and crew."
 utw_wh_tech_disruptors_2:0 "Gauss Flux Arcs"
 utw_wh_tech_disruptors_2_desc:0 "These upgraded disruptors fire bolts of more destructive ion particles at targets."
 utw_wh_tech_disruptors_3:0 "Gauss Annihilator Arrays"
 utw_wh_tech_disruptors_3_desc:0 "Extremely high-yield disruptors that fire quantum energy charges causing incredible damage to those unfortunate enough to get in their way."
 utw_wh_tech_energy_lance_1:0 "Prow Lances"
 utw_wh_tech_energy_lance_1_desc:0 "These heavy energy weapons fire focused particle beams that cause massive damage. The size of the emitter arrays limits their use to battleships and titans."
 utw_wh_tech_energy_lance_2:0 "Godsbane Lances"
 utw_wh_tech_energy_lance_2_desc:0 "A more powerful version of the particle lance, this weapon fires a tachyon beam of immense power. Like its predecessor, its use is limited to battleships and titans."
 utw_wh_tech_arc_emitter_1:0 "Lightning Arcs"
 utw_wh_tech_arc_emitter_1_desc:0 "Powerful weapons that launch a lightning arc of chaotic energy at targets, which in part can ignore armor and shields."
 utw_wh_tech_arc_emitter_2:0 "Focused Lightning Arcs"
 utw_wh_tech_arc_emitter_2_desc:0 "These upgraded emitters are equipped with better focusing lenses, resulting in a more powerful energy discharge."
 utw_wh_tech_energy_torpedoes_1:0 "Pulsar Lances"
 utw_wh_tech_energy_torpedoes_1_desc:0 "These energy projectiles consist of tightly concentrated protons capable of causing immense damage to the hull of enemy ships."
 utw_wh_tech_energy_torpedoes_2:0 "Heavy Pulsar Lances"
 utw_wh_tech_energy_torpedoes_2_desc:0 "Upgraded energy projectiles that rely on neutrons instead of protons for their destructive power."
 utw_wh_tech_mass_drivers_1:0 "Macro-Batterys"
 utw_wh_tech_mass_drivers_1_desc:0 "These electromagnetic projectile launchers use magnets to accelerate armor-piercing rounds towards targets at high speeds."
 utw_wh_tech_mass_drivers_2:0 "Mars Pattern Macrocannons"
 utw_wh_tech_mass_drivers_2_desc:0 "Coilguns are more powerful versions of the early mass drivers, using electromagnetic coils to rapidly accelerate projectiles towards targets."
 utw_wh_tech_mass_drivers_3:0 "Heavy Macrocannons"
 utw_wh_tech_mass_drivers_3_desc:0 "The latest in electromagnetic accelerators, railguns use twin parallel rails to fire projectiles at incredible speeds."
 utw_wh_tech_mass_drivers_4:0 "Disruption Macrocannons"
 utw_wh_tech_mass_drivers_4_desc:0 "A new version of the venerable railgun, with sturdier rails and an enhanced power supply. These weapons are even more powerful and accurate than their predecessors."
 utw_wh_tech_mass_drivers_5:0 "Grand Macrocannons"
 utw_wh_tech_mass_drivers_5_desc:0 "This updated version of the old coilgun design is even more destructive than the latest railgun designs. It is capable of launching projectiles with incredible accuracy and speed."
 utw_wh_tech_autocannons_1:0 "Autocannon Batterys"
 utw_wh_tech_autocannons_1_desc:0 "Large-caliber ballistic weapons that fire cased explosive shells. The main advantage of these cannons is their high rate of fire."
 utw_wh_tech_autocannons_2:0 "Ripper Autocannon Batterys"
 utw_wh_tech_autocannons_2_desc:0 "These upgraded rotary autocannons feature improved tracking and fire control systems. This allows them to maintain an even higher rate of fire."
 utw_wh_tech_autocannons_3:0 "Stormfire Autocannon Batterys"
 utw_wh_tech_autocannons_3_desc:0 "Advanced rotary autocannons capable of spewing a cloud of high-explosive shells at a target."
 utw_wh_tech_kinetic_artillery_1:0 "Bombardment Cannons"
 utw_wh_tech_kinetic_artillery_1_desc:0 "Very long-range artillery capable of hurling powerful rounds over extreme distances with a large degree of accuracy."
 utw_wh_tech_kinetic_artillery_2:0 "Heavy Bombardment Cannons"
 utw_wh_tech_kinetic_artillery_2_desc:0 "An even more powerful long-range, ship-based artillery cannon, equipped with a new barrel and an upgraded fire control computer."
 utw_wh_tech_mass_accelerator_1:0 "Nova Cannons"
 utw_wh_tech_mass_accelerator_1_desc:0 "An enormous mass accelerator cannon that can only be placed in a spinal mount and fires monstrously powerful rounds over vast distances."
 utw_wh_tech_mass_accelerator_2:0 "Mars Pattern Nova Cannons"
 utw_wh_tech_mass_accelerator_2_desc:0 "An even more powerful mass accelerator cannon that can rip through even the toughest shields."
 utw_wh_tech_missiles_1:0 "Hunter-Killer Missiles"
 utw_wh_tech_missiles_1_desc:0 "Space-to-space missiles equipped with high-yield nuclear warheads. Although based on old pre-space technology, these crude fire-and-forget weapons can be surprisingly effective at range."
 utw_wh_tech_missiles_2:0 "Krak Missiles"
 utw_wh_tech_missiles_2_desc:0 "These updated space-to-space missiles have more powerful fusion warheads and improved flight performance."
 utw_wh_tech_missiles_3:0 "Melta Missiles"
 utw_wh_tech_missiles_3_desc:0 "Advanced missiles equipped with very powerful antimatter warheads. A new and improved guidance system gives them a better chance of finding their targets."
 utw_wh_tech_missiles_4:0 "Deathstrike Missiles"
 utw_wh_tech_missiles_4_desc:0 "The latest version of space-to-space missile, this upgraded variant has an immensely powerful warhead that draws its energy from a zero point vacuum."
 utw_wh_tech_missiles_5:0 "Apocalypse Missiles"
 utw_wh_tech_missiles_5_desc:0 "These highly advanced missiles are equipped with limited onboard AI pilots that substantially improve their performance and ability to track targets."
 utw_wh_tech_swarmer_missiles_1:0 "Whirlwind Missile Pods"
 utw_wh_tech_swarmer_missiles_1_desc:0 "These smaller missiles are launched in volleys and have been specifically designed to overwhelm enemy point-defense systems."
 utw_wh_tech_swarmer_missiles_2:0 "Hyperios Missile Pods"
 utw_wh_tech_swarmer_missiles_2_desc:0 "New miniaturization techniques will allow us to equip swarmer missiles with more powerful warheads and improved flight performance."
 utw_wh_tech_torpedoes_1:0 "Plasma Torpedoes"
 utw_wh_tech_torpedoes_1_desc:0 "These torpedoes are essentially very large, slow-moving missiles. They are equipped with more powerful warheads and shield modulators that let them slip unmolested through energy screens."
 utw_wh_tech_torpedoes_2:0 "Melta Torpedoes"
 utw_wh_tech_torpedoes_2_desc:0 "Upgraded space torpedoes encased in armor, to better withstand enemy point-defense fire. The armor fragments into shards that cause additional damage when the torpedo detonates."
 utw_wh_tech_torpedoes_3:0 "Vortex Torpedoes"
 utw_wh_tech_torpedoes_3_desc:0 "Advanced torpedoes with very powerful warheads. They have a sleeker design, faster engines and upgraded shield modulators for slipping through energy screens."
 utw_wh_tech_flak_batteries_1:0 "Hydra Flak Batterys"
 utw_wh_tech_flak_batteries_1_desc:0 "Gun batteries that fire shrapnel rounds at close range. They are particularly lethal to enemy strike craft, but can also defend against missiles."
 utw_wh_tech_flak_batteries_2:0 "Hydra Flak Cannons"
 utw_wh_tech_flak_batteries_2_desc:0 "Upgraded flak batteries with new, more powerful shrapnel rounds."
 utw_wh_tech_flak_batteries_3:0 "Hydra Flak Artillerys"
 utw_wh_tech_flak_batteries_3_desc:0 "Predictive tracking algorithms and even more powerful rounds make these batteries incredibly lethal to enemy strike craft."
 utw_wh_tech_pd_tracking_1:0 "Defence Turrets"
 utw_wh_tech_pd_tracking_1_desc:0 "The best defense is a good offense."
 utw_wh_tech_pd_tracking_2:0 "Tracking Defence Turrets"
 utw_wh_tech_pd_tracking_2_desc:0 "Arrays of defensive armaments prove much more effective than independent countermeasures."
 utw_wh_tech_pd_tracking_3:0 "Augur-Guided Defence Turrets"
 utw_wh_tech_pd_tracking_3_desc:0 "Advanced prediction greatly increases the accuracy of active countermeasure systems."
 utw_wh_tech_strike_craft_1:0 "Fury Interceptor Squadrons"
 utw_wh_tech_strike_craft_1_desc:0 "These manned strike craft are launched from a mothership and rely on their speed and small size to survive long enough to punch through enemy defenses."
 utw_wh_tech_strike_craft_2:0 "Starhawk Bomber Squadrons"
 utw_wh_tech_strike_craft_2_desc:0 "The next generation of strike craft, featuring improved avionics, better handling characteristics and more powerful armaments."
 utw_wh_tech_strike_craft_3:0 "Thunderhawk Gunship Squadrons"
 utw_wh_tech_strike_craft_3_desc:0 "A further refinement in strike craft design, these advanced strike craft are a pilot's dream. Their performance far exceeds that of previous models."
