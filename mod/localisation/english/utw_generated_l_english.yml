 UTW_WH_MISSILE_5_DESC:0 "These highly advanced missiles are equipped with limited onboard AI pilots that substantially improve their performance and ability to track targets."
 UTW_WH_PLASMA_1:0 "Plasma Battery"
 UTW_WH_PLASMA_1_DESC:0 "Weapons that eject destructive balls of high-energy plasma at targets. These plasma projectiles are extremely effective at eating through ship armor and hull."
 UTW_WH_PLASMA_2:0 "Plasma Macrocannon"
 UTW_WH_PLASMA_2_DESC:0 "These new accelerators launch projectiles of high-energy plasma with improved containment fields. This results in less energy leakage as the projectile travels in space towards its target."
 UTW_WH_PLASMA_3:0 "Hellfire Plasma Macrocannon"
 UTW_WH_PLASMA_3_DESC:0 "The latest in plasma weaponry, these cannons are fully militarized versions of the older, somewhat improvised plasma throwers. Their plasma projectiles are even deadlier."
 UTW_WH_POINT_DEFENCE_1_DESC:0 "Hull-mounted countermeasures against missiles and strike craft are often essential for larger and slower military vessels."
 UTW_WH_POINT_DEFENCE_2_DESC:0 "Updated prediction algorithms improves tracking and point-defense efficiency."
 UTW_WH_POINT_DEFENCE_3_DESC:0 "A wider range of available ammunition types vastly improves the effective interception rate of incoming threats."
 UTW_WH_RED_LASER:0 "Lascannon Battery"
 UTW_WH_RED_LASER_DESC:0 "Laser weapons fire focused beams of light at targets, causing damage through the generation of intense heat."
 UTW_WH_STRIKE_CRAFT_HANGAR_1_DESC:0 "These manned strike craft are launched from a mothership and rely on their speed and small size to survive long enough to punch through enemy defenses."
 UTW_WH_STRIKE_CRAFT_HANGAR_2_DESC:0 "The next generation of strike craft, featuring improved avionics, better handling characteristics and more powerful armaments."
 UTW_WH_STRIKE_CRAFT_HANGAR_3_DESC:0 "A further refinement in strike craft design, these advanced strike craft are a pilot's dream. Their performance far exceeds that of previous models."
